<div class="chart">
  <p>Clôture ajustée · USD</p>
  @if (points().length) {
    <svg
      #chartSvg
      viewBox="0 0 720 234"
      aria-label="Graphique des clôtures ajustées"
      class="interactive"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerCancel()"
    >
      <path d="M18 37H702 M18 93H702 M18 150H702 M18 206H702" class="grid"/>
      @if (rangeOverlay(); as band) {
        <rect [attr.x]="band.x1" y="24" [attr.width]="band.x2 - band.x1" height="190" class="range"/>
      }
      <polyline [attr.points]="line()" class="series"/>
      @for (point of points(); track point.date) {
        @if (point.date === sessionMarker()) {
          <line [attr.x1]="point.x" [attr.x2]="point.x" y1="24" y2="214" class="selection"/>
          <circle [attr.cx]="point.x" [attr.cy]="point.y" r="5" class="selected"/>
        }
      }
    </svg>
    <div class="dates">
      <span>{{ caption().left }}</span>
      <strong>{{ caption().center }}</strong>
      <span>{{ caption().right }}</span>
    </div>
  }
</div>
