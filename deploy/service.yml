Parameters:
  Image:
    Type: String
  BedrockModelId:
    Type: String
    MinLength: 1
  SecUserAgent:
    Type: String
    Default: ''
    Description: Nom et courriel de contact pour les téléchargements SEC

Resources:
  Cluster:
    Type: AWS::ECS::Cluster

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  InfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeBedrock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action: bedrock:InvokeTool
                Resource: !Sub arn:${AWS::Partition}:bedrock::${AWS::AccountId}:system-tool/amazon.nova_grounding
              - Effect: Allow
                Action: bedrock-agentcore:InvokeWebSearch
                Resource: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:aws:tool/web-search.v1

  Dashboard:
    Type: AWS::ECS::ExpressGatewayService
    Properties:
      Cluster: !Ref Cluster
      ServiceName: alphaforge
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      InfrastructureRoleArn: !GetAtt InfrastructureRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      HealthCheckPath: /api/health/
      ScalingTarget:
        MinTaskCount: 1
        MaxTaskCount: 2
      PrimaryContainer:
        Image: !Ref Image
        ContainerPort: 8080
        Environment:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: BEDROCK_MODEL_ID
            Value: !Ref BedrockModelId
          - Name: MARKET_WEB_SEARCH
            Value: '1'
          - Name: MARKET_WEB_SEARCH_AGENTCORE
            Value: '1'
          - Name: MARKET_ALLOW_LOCAL
            Value: '0'
          - Name: SEC_USER_AGENT
            Value: !Ref SecUserAgent

Outputs:
  Endpoint:
    Value: !GetAtt Dashboard.Endpoint
