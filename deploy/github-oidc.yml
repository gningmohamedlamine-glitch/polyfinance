AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Rôle IAM que GitHub Actions emprunte par OIDC (sans clé stockée) pour lancer deploy/deploy.sh.
  Compte de l'événement uniquement : le rôle reçoit AdministratorAccess, car deploy.sh crée des
  piles CloudFormation, un dépôt ECR, un service ECS Express et des rôles IAM.

Parameters:
  GitHubRepo:
    Type: String
    Description: Dépôt autorisé, au format propriétaire/nom
    Default: gningmohamedlamine-glitch/polyfinance
  Branch:
    Type: String
    Default: main
  CreateProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Mettre false si le fournisseur OIDC token.actions.githubusercontent.com existe déjà dans le compte

Conditions:
  MakeProvider: !Equals [!Ref CreateProvider, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: alphaforge-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Seule la branche choisie du dépôt peut emprunter le rôle.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/${Branch}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  RoleArn:
    Description: À copier dans la variable GitHub AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
