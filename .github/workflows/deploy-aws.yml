name: Déployer AlphaForge sur AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: alphaforge-workshop-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # deploy.sh vérifie la réponse finale avec python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # Textes des sources du catalogue (BLS, Fed, SEC) pour vérifier les extraits cités.
      # La SEC exige un User-Agent avec un nom et un courriel : variable GitHub SEC_USER_AGENT.
      - name: Télécharger les sources du catalogue
        if: vars.SEC_USER_AGENT != ''
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/fetch_sources.py || echo "::warning::Sources non téléchargées : extraits non vérifiés"
      - name: Construire, publier et vérifier
        env:
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/deploy.sh
